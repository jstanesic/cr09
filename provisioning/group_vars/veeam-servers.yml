# Veeam Backup & Replication comes preinstalled on the bckup1/bckup2 base image
# (Community Edition, no license file) — the unattended-install play has been
# removed. This file only holds vars for the repository directories and the
# pre-staged LIN01 backup that Lab A1 imports at the start of the course.

# Backup repository directories ensured on each Veeam server (the Default
# repository on bckup1, the immutable/offsite copy target on bckup2). Created
# by the "Deploy lab verification scripts" play in playbook.yml.
veeam_repo_paths:
  - 'C:\Backups\Default'
  - 'C:\Backups\Immutable'

# Pre-staged LIN01 backup, baked into the shared bckup1/bckup2 image at this path
# — so BOTH Veeam servers hold their own copy of it. No lab produces this file;
# see the build/capture procedure in ../../LIN01_vbk_runbook.md.
#   bckup1's copy: Lab A1 imports it to bring the production application server
#                  online for the first time.
#   bckup2's copy: Lab D1 imports it as the clean, pre-attack restore source once
#                  ransomware has encrypted both the production VM and its replica.
#                  Lab B1's Backup Copy job does NOT produce it — that job copies
#                  DC01, not LIN01.
lin01_vbk_path: 'C:\Installs\Backups\LIN01.vbk'
