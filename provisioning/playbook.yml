- name: Wait until WinRM/PSRP is reachable on every Windows host
  hosts: domain-controllers:windows-members
  gather_facts: false
  tasks:
    - name: Wait for PSRP listener to accept connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 900

- name: Active Directory — promote domain controller (dc01)
  hosts: domain-controllers
  gather_facts: false
  vars:
    ad_domain_name: drlab.local
    ad_admin_password: Password123!
  roles:
    - name: ansible-role-user-access-windows
      user_access_username: localadmin
      user_access_password: Password123!
      user_access_rdp: True
      user_access_admin: True
  tasks:
    - name: Ensure AD DS Windows feature is installed
      register: ad_feature
      ansible.windows.win_feature:
        name: AD-Domain-Services
        include_management_tools: true
        state: present
    - name: Detect whether host is already promoted to a domain controller
      register: dc_role
      changed_when: false
      ansible.windows.win_shell: >-
        (Get-CimInstance Win32_ComputerSystem).DomainRole
    - name: Set a strong password on the built-in Administrator account
      when: (dc_role.stdout | trim | int) < 4
      ansible.windows.win_user:
        name: Administrator
        password: '{{ ad_admin_password }}'
        password_never_expires: true
        state: present
    - name: Promote host to domain controller
      when: ad_feature is succeeded
      microsoft.ad.domain:
        dns_domain_name: '{{ ad_domain_name }}'
        safe_mode_password: '{{ ad_admin_password }}'
        reboot: true
    - name: Wait for AD DS to come up after the post-promotion reboot
      ansible.windows.win_wait_for:
        host: 127.0.0.1
        port: 389
        delay: 30
        timeout: 600
    - name: Ensure default OU for trainees exists
      microsoft.ad.ou:
        name: Trainees
        path: DC={{ ad_domain_name.split(".") | join(",DC=") }}
        state: present
    - name: Create the domain account students use to administer the domain
      microsoft.ad.user:
        name: domainuser
        sam_account_name: domainuser
        upn: domainuser@{{ ad_domain_name }}
        password: Password123!
        password_never_expires: true
        enabled: true
        state: present
        groups:
          add:
            - Domain Admins
    # Lab C1 (Phase 3) restores C:\Users\Administrator\Documents\Critical.txt
    # via Veeam guest-file restore, so the file must exist before backups run.
    - name: Ensure the Administrator Documents folder exists
      ansible.windows.win_file:
        path: C:\Users\Administrator\Documents
        state: directory
    - name: Seed the Critical.txt file used by the C1 granular file restore
      ansible.windows.win_copy:
        dest: C:\Users\Administrator\Documents\Critical.txt
        content: |
          CADMUS CR09 — Disaster Recovery Operations.
          This file is restored from the offsite DC01 backup in Lab C1
          to prove the integrity of a backup copy via granular file restore.

- name: Active Directory — join Windows member servers to the domain
  hosts: windows-members
  gather_facts: false
  vars:
    ad_domain_name: drlab.local
    ad_admin_password: Password123!
    ad_dc_ip: 10.9.10.3
  roles:
    - name: ansible-role-user-access-windows
      user_access_username: localadmin
      user_access_password: Password123!
      user_access_rdp: True
      user_access_admin: True
  tasks:
    - name: Point DNS at the domain controller on all adapters
      ansible.windows.win_dns_client:
        adapter_names: '*'
        dns_servers:
          - '{{ ad_dc_ip }}'
    - name: Join host to the AD domain
      microsoft.ad.membership:
        dns_domain_name: '{{ ad_domain_name }}'
        domain_admin_user: Administrator@{{ ad_domain_name }}
        domain_admin_password: '{{ ad_admin_password }}'
        state: domain
        reboot: true

- name: Hyper-V hosts — install the role and configure switches + replica
  hosts: hyperv-hosts
  gather_facts: false
  tasks:
    - name: Ensure the Hyper-V role and management tools are installed
      register: hyperv_feature
      ansible.windows.win_feature:
        name: Hyper-V
        include_management_tools: true
        state: present
    - name: Reboot if the Hyper-V role install requested it
      when: hyperv_feature.reboot_required | default(false)
      ansible.windows.win_reboot:
    - name: Wait for the Hyper-V management service (vmms) to be present
      register: vmms_info
      until: vmms_info.services | length > 0
      retries: 30
      delay: 10
      ansible.windows.win_service_info:
        name: vmms
    # Lab A1 deletes C:\Hyper-V\LIN01\Virtual Hard Disks\LIN01.vhdx to simulate
    # storage loss, so the directory tree must be present on the production host.
    - name: Ensure the Hyper-V directory layout exists
      loop:
        - '{{ hyperv_vm_root }}'
        - '{{ hyperv_vm_root }}\LIN01\Virtual Hard Disks'
        - '{{ hyperv_replica_storage }}'
      ansible.windows.win_file:
        path: '{{ item }}'
        state: directory
    - name: Create the host's Hyper-V virtual switches (Production-Switch / DR-Switch)
      loop: '{{ hyperv_switches | default([]) }}'
      loop_control:
        label: '{{ item.name }}'
      register: vmswitch
      changed_when: "'created' in vmswitch.stdout"
      ansible.windows.win_shell: |
        if (-not (Get-VMSwitch -Name '{{ item.name }}' -ErrorAction SilentlyContinue)) {
          New-VMSwitch -Name '{{ item.name }}' -SwitchType {{ item.type }} | Out-Null
          'created'
        } else { 'exists' }
    # Veeam's "Add Server" wizard pushes its deployment agent to this host over
    # the ADMIN$ share (SMB, port 445) plus WMI/RPC — both are blocked by the
    # default Windows Server firewall profile. Without this, Add Server fails
    # with "The specified network name is no longer available" (A1) or a
    # similar failure when restoring a VM onto SRV02 (D1).
    - name: Allow File and Printer Sharing (SMB) inbound through the firewall
      ansible.windows.win_shell: >-
        Enable-NetFirewallRule -DisplayGroup 'File and Printer Sharing'
      changed_when: false
      failed_when: false
    - name: Allow Windows Management Instrumentation (WMI) inbound through the firewall
      ansible.windows.win_shell: >-
        Enable-NetFirewallRule -DisplayGroup 'Windows Management Instrumentation (WMI)'
      changed_when: false
      failed_when: false
    # Lab D1's ransomware simulation is launched from BCKUP1 and reaches these hosts
    # over WinRM (Invoke-Command) to corrupt LIN01's disk — the running production VM
    # on SRV02, the off replica on SRV01. Open the WinRM listener so that remote call
    # can authenticate; without it the orchestrator fails with "cannot connect".
    - name: Allow Windows Remote Management inbound through the firewall
      ansible.windows.win_shell: >-
        Enable-NetFirewallRule -DisplayGroup 'Windows Remote Management'
      changed_when: false
      failed_when: false
    # The D1 simulation payload runs here (Invoke-Command from BCKUP1) and performs
    # deliberately ransomware-like actions — overwriting VHDX headers, renaming disks
    # to .crypted, dropping a ransom note — which Microsoft Defender detects and blocks.
    # These are isolated, throwaway lab hosts, so relax Defender enough for the
    # simulation to run. LAB-ONLY: never do this on a production host.
    - name: Relax Microsoft Defender so the D1 simulation can run (lab-only)
      ansible.windows.win_shell: |
        Add-MpPreference -ExclusionPath 'C:\Scripts','C:\Hyper-V','C:\ProgramData\Microsoft\Windows\Virtual Hard Disks' -ErrorAction SilentlyContinue
        Set-MpPreference -EnableControlledFolderAccess Disabled -ErrorAction SilentlyContinue
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      changed_when: false
      failed_when: false
    # NOTE: Hyper-V Replica is deliberately left unprovisioned — neither the Replica
    # server role nor its firewall rule. Lab B1 step 1 has the learner enable both
    # themselves on SRV01 and SRV02: the role via Hyper-V Settings -> Replication
    # Configuration (or Set-VMReplicationServer), then the listener via
    # Enable-NetFirewallRule -DisplayName 'Hyper-V Replica HTTP Listener (TCP-In)'.
    # Windows creates that rule disabled by default, so replication genuinely fails
    # until the learner enables it — which is the point of the exercise. Only the
    # replica storage directory is pre-staged. Do not add either task here.
- name: Prepare Veeam servers (firewall, repositories, verification scripts)
  hosts: veeam-servers
  gather_facts: false
  tasks:
    # The verification scripts and the labs both reach across hosts from BCKUP1:
    # Invoke-Command to SRV02/DC01 over WinRM, and Veeam's Add Server / agent
    # deployment over SMB (ADMIN$, port 445) plus WMI. All three inbound rules are
    # disabled by the default Windows Server firewall profile, which surfaces as
    # "Access is denied" on remoting and "The specified network name is no longer
    # available" in Veeam's wizards.
    - name: Allow Windows Remote Management inbound through the firewall
      ansible.windows.win_shell: >-
        Enable-NetFirewallRule -DisplayGroup 'Windows Remote Management'
      changed_when: false
      failed_when: false
    - name: Allow File and Printer Sharing (SMB) inbound through the firewall
      ansible.windows.win_shell: >-
        Enable-NetFirewallRule -DisplayGroup 'File and Printer Sharing'
      changed_when: false
      failed_when: false
    - name: Allow Windows Management Instrumentation (WMI) inbound through the firewall
      ansible.windows.win_shell: >-
        Enable-NetFirewallRule -DisplayGroup 'Windows Management Instrumentation (WMI)'
      changed_when: false
      failed_when: false
    # BCKUP1 launches the D1 simulation and encrypts LIN01's on-site backup, both of
    # which Microsoft Defender flags as ransomware. Relax it on the Veeam servers so
    # the simulation runs. LAB-ONLY: never do this on a production host.
    - name: Relax Microsoft Defender so the D1 simulation can run (lab-only)
      ansible.windows.win_shell: |
        Add-MpPreference -ExclusionPath 'C:\Scripts','C:\Backup','C:\Installs\Backups' -ErrorAction SilentlyContinue
        Set-MpPreference -EnableControlledFolderAccess Disabled -ErrorAction SilentlyContinue
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      changed_when: false
      failed_when: false
    - name: Ensure C:\Scripts exists
      ansible.windows.win_file:
        path: C:\Scripts
        state: directory
    - name: Ensure Veeam backup repository directories exist
      loop: '{{ veeam_repo_paths }}'
      ansible.windows.win_file:
        path: '{{ item }}'
        state: directory
    - name: Deploy Verify-LabA1.ps1 to BCKUP1
      when: inventory_hostname in groups['veeam-primary'] | default([])
      ansible.windows.win_copy:
        src: files/Verify-LabA1.ps1
        dest: C:\Scripts\Verify-LabA1.ps1
    - name: Deploy Verify-LabB1.ps1 to BCKUP1
      when: inventory_hostname in groups['veeam-primary'] | default([])
      ansible.windows.win_copy:
        src: files/Verify-LabB1.ps1
        dest: C:\Scripts\Verify-LabB1.ps1
    - name: Deploy Verify-LabC1.ps1 to BCKUP1
      when: inventory_hostname in groups['veeam-primary'] | default([])
      ansible.windows.win_copy:
        src: files/Verify-LabC1.ps1
        dest: C:\Scripts\Verify-LabC1.ps1
    # Verify-LabD1 only remotes to SRV02 to check LIN01's state, so it can run from
    # BCKUP1 alongside the other verify scripts — no need to switch to the BCKUP2
    # console just for the passkey check. The clean restore itself still runs on BCKUP2.
    - name: Deploy Verify-LabD1.ps1 to BCKUP1
      when: inventory_hostname in groups['veeam-primary'] | default([])
      ansible.windows.win_copy:
        src: files/Verify-LabD1.ps1
        dest: C:\Scripts\Verify-LabD1.ps1
    # The D1 ransomware simulation orchestrator is launched from BCKUP1 only. It must
    # NOT land on BCKUP2 — BCKUP2 holds the clean LIN01.vbk the lab restores from, and
    # running the script there would encrypt the very copy the recovery depends on.
    - name: Deploy Simulate-Attack.ps1 to BCKUP1
      when: inventory_hostname in groups['veeam-primary'] | default([])
      ansible.windows.win_copy:
        src: files/Simulate-Attack.ps1
        dest: C:\Scripts\Simulate-Attack.ps1

# LIN01 is no longer provisioned here — it is baked into LIN01.vbk once (see
# ../LIN01_vbk_runbook.md) and Lab A1 brings it online on SRV01 by importing and
# restoring that file. Nothing here creates a flat "lin01" node.
#
# Lab D1's ransomware attack is simulated entirely at the hypervisor/host layer
# (files/Simulate-Attack.ps1, launched from BCKUP1) — it corrupts LIN01's virtual
# disks on SRV01/SRV02 and encrypts the on-site backup on BCKUP1. Nothing needs to
# be baked into the guest image for D1: the only in-guest artefact the lab checks is
# /var/www/html/index.html ("It works!"), which is already present from Lab A1.
