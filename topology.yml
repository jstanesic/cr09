name: cr09
hosts:
  - name: dc01
    flavor: c4_r5_d50
    base_box:
      image: windows-server-2019-x86_64
      mgmt_user: windows
      mgmt_protocol: winrm
    hidden: false
  - name: srv01
    # 8GB RAM: Windows Server + Hyper-V role must run NSRV03 permanently and,
    # during Lab C1's alternate-location restore drill, NSRV03-Test concurrently.
    flavor: c4_r8_d50
    base_box:
      image: windows-server-2019-x86_64
      mgmt_user: windows
      mgmt_protocol: winrm
    hidden: false
  - name: srv02
    # 8GB RAM: parity with srv01 — hosts the failed-over NSRV03 replica (B1/D1)
    # and is the clean-restore target in D1.
    flavor: c4_r8_d50
    base_box:
      image: windows-server-2019-x86_64
      mgmt_user: windows
      mgmt_protocol: winrm
    hidden: false
  - name: bckup1
    # The Veeam-preinstalled base image (cr09-windows-server-2025-x86_64) has a
    # minimum-disk requirement of 120GB baked into its image metadata, so any
    # flavor under 120GB disk is rejected at deploy regardless of the catalog.
    # c4_r5_d120 is the only c4 flavor that clears that floor.
    flavor: c4_r5_d120
    base_box:
      image: cr09-windows-server-2025-x86_64
      mgmt_user: windows
     #  mgmt_protocol: winrm
    hidden: false
  - name: bckup2
    # 5GB RAM / 120GB disk: mostly a passive immutable repository target —
    # this is the actual backup-storage sink, so disk matters more than RAM
    # here (catalog only pairs 120GB disk with 5GB RAM on c4).
    flavor: c4_r5_d120
    base_box:
      image: cr09-windows-server-2025-x86_64
      mgmt_user: windows
     #  mgmt_protocol: winrm
    hidden: false
routers:
  - name: r-prod
    flavor: standard.small
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    hidden: false
  - name: r-dr
    flavor: standard.small
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    hidden: false
  - name: r-backup
    flavor: standard.small
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    hidden: false
networks:
  - name: prod
    cidr: 10.9.10.0/24
    accessible_by_user: true
    hidden: false
  - name: dr
    cidr: 10.9.20.0/24
    accessible_by_user: true
    hidden: false
  - name: backup
    cidr: 10.9.30.0/24
    accessible_by_user: false
    hidden: false
wan:
  name: wan
  cidr: 10.9.100.0/24
net_mappings:
  - host: dc01
    network: prod
    ip: 10.9.10.3
  - host: srv01
    network: prod
    ip: 10.9.10.4
  - host: srv01
    network: backup
    ip: 10.9.30.4
  - host: srv02
    network: dr
    ip: 10.9.20.4
  - host: srv02
    network: backup
    ip: 10.9.30.5
  - host: bckup1
    network: prod
    ip: 10.9.10.5
  - host: bckup1
    network: backup
    ip: 10.9.30.6
  - host: bckup2
    network: dr
    ip: 10.9.20.5
  - host: bckup2
    network: backup
    ip: 10.9.30.7
router_mappings:
  - router: r-prod
    network: prod
    ip: 10.9.10.1
  - router: r-dr
    network: dr
    ip: 10.9.20.1
  - router: r-backup
    network: backup
    ip: 10.9.30.1
groups:
  - name: domain-controllers
    nodes:
      - dc01
  - name: hyperv-hosts
    nodes:
      - srv01
      - srv02
  - name: veeam-servers
    nodes:
      - bckup1
      - bckup2
  - name: veeam-primary
    nodes:
      - bckup1
  - name: veeam-repo
    nodes:
      - bckup2
  - name: windows-members
    nodes:
      - srv01
      - srv02
      - bckup1
      - bckup2
